name: Notícias do dia
on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  edicao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python noticias.py
      - run: |
          git config user.name "resumo-diario"
          git config user.email "resumo-diario@users.noreply.github.com"
          git add docs historico.json
          git commit -m "Edição $(TZ=America/Sao_Paulo date +%d/%m)" || echo "sem mudanças"
          git push
